openapi: 3.0.3
info:
  title: LOGMOV - API de Autenticação e Gestão de Usuários
  description: |
    API RESTful de autenticação baseada em JWT (JSON Web Token) desenvolvida em PHP 8.2+ para a plataforma LOGMOV (logística e entregas).
    Permite autenticação com email e senha, validação de sessão em `/api/me`, além de recuperação de senha com tokens temporários expirando estritamente em **30 minutos**.
  version: 1.0.0
  contact:
    name: Suporte LOGMOV
    email: admin@logmov.com

servers:
  - url: http://localhost:8001
    description: Servidor de Desenvolvimento Local (Docker)

paths:
  /api/login:
    post:
      summary: Autenticar usuário
      description: Valida e-mail e senha do usuário. Em caso de sucesso, emite um JWT Bearer Token contendo o perfil e identificadores.
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@logmov.com
                password:
                  type: string
                  format: password
                  example: admin123
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          description: Parâmetros inválidos ou campos ausentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciais incorretas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Conta inativa ou desativada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me:
    get:
      summary: Obter dados do usuário autenticado
      description: Retorna as informações do usuário atual mediante fornecimento do token JWT Bearer.
      tags:
        - Autenticação
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dados retornados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeSuccessResponse'
        '401':
          description: Token não fornecido, inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuário não localizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/logout:
    post:
      summary: Encerrar sessão (Logout)
      description: Invalida o token JWT atual enviando-o para a lista de tokens revogados (Blacklist), impedindo seu reuso.
      tags:
        - Autenticação
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sessão encerrada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Logout realizado com sucesso. Sessão encerrada.
        '401':
          description: Token não fornecido, inválido ou já revogado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/empresas/stats:
    get:
      summary: Métricas agregadas de empresas
      description: Retorna contadores de empresas (total, aprovados, pendentes, suspensos) para os cards do dashboard.
      tags:
        - Empresas
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Métricas calculadas com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 12
                      aprovados:
                        type: integer
                        example: 10
                      pendentes:
                        type: integer
                        example: 1
                      suspensos:
                        type: integer
                        example: 1

  /api/empresas:
    get:
      summary: Listar empresas parceiras
      description: Retorna a listagem de empresas com filtros opcionais de busca textual e status.
      tags:
        - Empresas
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Termo de busca em empresa, responsável ou CNPJ
        - in: query
          name: status
          schema:
            type: string
            enum: [Aprovado, Pendente, Suspenso]
          description: Filtro exato por status
      responses:
        '200':
          description: Lista de empresas recuperada com sucesso
    post:
      summary: Cadastrar nova empresa parceira
      description: Cria uma nova empresa parceira validando campos obrigatórios e unicidade de CNPJ.
      tags:
        - Empresas
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - responsavel
                - empresa
                - cnpj
              properties:
                responsavel:
                  type: string
                  example: Carlos Eduardo
                empresa:
                  type: string
                  example: LogMove Express
                cnpj:
                  type: string
                  example: 12.345.678/0001-99
                whatsapp:
                  type: string
                  example: (11) 98765-4321
                cidadeUf:
                  type: string
                  example: São Paulo / SP
                endereco:
                  type: string
                  example: Av. Paulista, 1500
                status:
                  type: string
                  enum: [Aprovado, Pendente, Suspenso]
                  example: Aprovado
      responses:
        '201':
          description: Empresa cadastrada com sucesso
        '400':
          description: Campos obrigatórios ausentes
        '409':
          description: CNPJ já cadastrado

  /api/empresas/{id}:
    get:
      summary: Obter detalhes da empresa
      tags:
        - Empresas
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalhes da empresa
        '404':
          description: Empresa não encontrada
    put:
      summary: Atualizar cadastro da empresa
      tags:
        - Empresas
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Empresa atualizada
    delete:
      summary: Excluir empresa parceira
      tags:
        - Empresas
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Empresa excluída com sucesso

  /api/empresas/{id}/status:
    patch:
      summary: Alterar status da empresa
      tags:
        - Empresas
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [Aprovado, Pendente, Suspenso]
      responses:
        '200':
          description: Status alterado com sucesso

  /api/motoboys/stats:
    get:
      summary: Obter estatísticas e contadores de motoboys parceiros
      description: Retorna contadores agregados para cards de dashboard (total, ativos, pendentes, recusados).
      tags:
        - Motoboys
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Estatísticas obtidas com sucesso

  /api/motoboys:
    get:
      summary: Listar motoboys parceiros
      description: Retorna lista de motoboys com suporte a filtros por termo de busca e status.
      tags:
        - Motoboys
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Busca por nome, email, MEI ou placa
        - in: query
          name: status
          schema:
            type: string
            enum: [Ativo, Pendente, Recusado]
          description: Filtro por status
      responses:
        '200':
          description: Lista de motoboys recuperada com sucesso
    post:
      summary: Cadastrar novo motoboy parceiro
      description: Registra um novo motoboy parceiro no sistema com status inicial 'Pendente'.
      tags:
        - Motoboys
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
                - email
                - senha
                - mei
                - whatsapp
              properties:
                nome:
                  type: string
                  example: Marcos Oliveira
                email:
                  type: string
                  format: email
                  example: marcos.moto@logmov.com
                senha:
                  type: string
                  format: password
                  example: moto1234
                mei:
                  type: string
                  example: 45.123.789/0001-22
                whatsapp:
                  type: string
                  example: (11) 97777-8888
                cnh:
                  type: string
                  example: '98765432100'
                placa:
                  type: string
                  example: ABC-1234
                cidadeUf:
                  type: string
                  example: São Paulo / SP
                status:
                  type: string
                  enum: [Ativo, Pendente, Recusado]
                  example: Pendente
      responses:
        '201':
          description: Motoboy parceiro cadastrado com sucesso
        '409':
          description: E-mail ou MEI já cadastrado
        '422':
          description: Dados inválidos ou campos obrigatórios ausentes

  /api/motoboys/{id}:
    get:
      summary: Obter detalhes do motoboy
      tags:
        - Motoboys
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalhes do motoboy
        '404':
          description: Motoboy não encontrado
    put:
      summary: Atualizar cadastro do motoboy
      tags:
        - Motoboys
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
                - email
                - mei
                - whatsapp
              properties:
                nome:
                  type: string
                email:
                  type: string
                senha:
                  type: string
                  description: Opcional - enviar apenas se desejar alterar
                mei:
                  type: string
                whatsapp:
                  type: string
                cnh:
                  type: string
                placa:
                  type: string
                cidadeUf:
                  type: string
      responses:
        '200':
          description: Dados atualizados com sucesso
        '404':
          description: Motoboy não encontrado
    delete:
      summary: Remover motoboy parceiro
      tags:
        - Motoboys
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Motoboy removido com sucesso

  /api/motoboys/{id}/status:
    patch:
      summary: Alterar status do motoboy (Aprovar / Recusar)
      description: Atualiza o status para Ativo, Pendente ou Recusado. Se for Recusado, o campo motivo_recusa é obrigatório.
      tags:
        - Motoboys
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [Ativo, Pendente, Recusado]
                  example: Ativo
                motivo_recusa:
                  type: string
                  example: CNH vencida
      responses:
        '200':
          description: Status atualizado com sucesso
        '422':
          description: Motivo de recusa obrigatório ao recusar

  /api/forgot-password:
    post:
      summary: Solicitar redefinição de senha
      description: Gera um token de redefinição com validade de 30 minutos vinculado ao e-mail informado.
      tags:
        - Recuperação de Senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: admin@logmov.com
      responses:
        '200':
          description: Instruções e token gerados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Instruções para redefinição de senha geradas com sucesso.
                  data:
                    type: object
                    properties:
                      reset_token:
                        type: string
                        example: 4a2b9c7e1f8d3a5e...
                      expires_in:
                        type: string
                        example: 30 minutos
                      expires_at:
                        type: string
                        format: date-time
                        example: '2026-10-18 21:16:25'
        '400':
          description: E-mail em formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reset-password:
    post:
      summary: Redefinir senha utilizando o Reset Token
      description: Valida o token temporário de 30 minutos e atualiza a senha com criptografia Bcrypt.
      tags:
        - Recuperação de Senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                  description: Token de 64 caracteres recebido no fluxo de recuperação
                  example: 4a2b9c7e1f8d3a5e2f9d8c7b6a5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e
                password:
                  type: string
                  format: password
                  minLength: 6
                  description: Nova senha (mínimo 6 caracteres)
                  example: novaSenhaForte2026!
      responses:
        '200':
          description: Senha redefinida com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Senha redefinida com sucesso! Você já pode realizar o login com suas novas credenciais.
        '400':
          description: Token inválido, expirado ou senha curta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Insira o token JWT no formato: Bearer <seu-token>'

  schemas:
    LoginSuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Login realizado com sucesso
        data:
          type: object
          properties:
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            user:
              type: object
              properties:
                id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: Administrador Master
                email:
                  type: string
                  example: admin@logmov.com
                role:
                  type: string
                  enum: [admin, empresa, motoboy]
                  example: admin

    MeSuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Dados do usuário autenticado
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: Administrador Master
            email:
              type: string
              example: admin@logmov.com
            role:
              type: string
              example: admin
            status:
              type: string
              example: ativo
            created_at:
              type: string
              example: '2026-10-18 20:00:00'
            updated_at:
              type: string
              example: '2026-10-18 20:00:00'

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: E-mail ou senha incorretos.
