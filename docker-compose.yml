services:
  logmov-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logmov_auth_api
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: logmov-db
      DB_PORT: 3306
      DB_NAME: logmov_db
      DB_USER: root
      DB_PASS: rootpassword
      JWT_SECRET: super_secret_logmov_key_2026_change_in_production!#@
      JWT_EXPIRATION_TIME: 28800
      RESET_TOKEN_EXPIRATION_MINUTES: 30
      CORS_ALLOWED_ORIGIN: http://localhost:3000
    depends_on:
      logmov-db:
        condition: service_healthy

  logmov-db:
    image: mysql:8.0
    container_name: logmov_mysql_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: logmov_db
    ports:
      - "3307:3306"
    volumes:
      - logmov_mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  logmov-phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: logmov_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: logmov-db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
      UPLOAD_LIMIT: 64M
    ports:
      - "8085:80"
    depends_on:
      - logmov-db

volumes:
  logmov_mysql_data:
